name: dsdarwin
services:
  opal:
    image: obiba/opal:6.1.3
    ports:
      - "8880:8080"
    environment:
      - OPAL_ADMINISTRATOR_PASSWORD=password
      - ROCK_HOSTS=rock:8085
    volumes:
      - opal-home:/srv

  # One-off: downloads and builds Delphi-100k into omop-data, or skips if it is
  # there, then exits. Same image as rock, so the duckdb versions match.
  delphi-setup:
    image: dsdarwin/rock:dev
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["Rscript", "/scripts/load-delphi.R"]
    volumes:
      - omop-data:/data
      - ../scripts/load-delphi.R:/scripts/load-delphi.R:ro

  rock:
    image: dsdarwin/rock:dev
    depends_on:
      delphi-setup:
        condition: service_completed_successfully
    volumes:
      - rock-home:/srv # R packages installed via opalr survive restarts
      - omop-data:/data:ro # the CDM: read-only for every R session

volumes:
  opal-home:
  rock-home:
  omop-data: 
